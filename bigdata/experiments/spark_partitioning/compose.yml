name: witw-spark-partitioning
x-common: &common
  image: witw-clustering-lab:local
  pull_policy: never
  user: root
  networks: [lab]
  volumes:
    - .:/experiment:ro
    - ../../spark/apps:/source:ro
    - results:/results
  environment: &env
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    BLIS_NUM_THREADS: "1"
    PYTHONHASHSEED: "0"
services:
  master:
    <<: *common
    hostname: master
    cpus: 0.5
    mem_limit: 512m
    environment:
      <<: *env
      SPARK_DAEMON_MEMORY: 256m
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.master.Master, --host, master, --port, "7077"]
    healthcheck:
      test: [CMD, python3, -c, "import socket;socket.create_connection(('master',7077),2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker-1:
    <<: *common
    hostname: worker-1
    cpus: 2
    mem_limit: 4g
    environment:
      <<: *env
      SPARK_LOCAL_HOSTNAME: worker-1
      SPARK_DAEMON_MEMORY: 256m
    command: [python3, /experiment/apps/resource_monitor.py, --output, "/results/${RUN_ID:-quick}/resources-worker-1.csv", --, /opt/spark/bin/spark-class, org.apache.spark.deploy.worker.Worker, spark://master:7077, --cores, "2", --memory, 3g]
    depends_on:
      master: {condition: service_healthy}
  worker-2:
    <<: *common
    hostname: worker-2
    cpus: 2
    mem_limit: 4g
    environment:
      <<: *env
      SPARK_LOCAL_HOSTNAME: worker-2
      SPARK_DAEMON_MEMORY: 256m
    command: [python3, /experiment/apps/resource_monitor.py, --output, "/results/${RUN_ID:-quick}/resources-worker-2.csv", --, /opt/spark/bin/spark-class, org.apache.spark.deploy.worker.Worker, spark://master:7077, --cores, "2", --memory, 3g]
    depends_on:
      master: {condition: service_healthy}
  driver:
    <<: *common
    hostname: driver
    cpus: 1
    mem_limit: 3g
    environment:
      <<: *env
      SPARK_LOCAL_HOSTNAME: driver
    entrypoint: [python3, /experiment/apps/resource_monitor.py, --output, "/results/${RUN_ID:-quick}/resources-driver.csv", --]
    command: [/opt/spark/bin/spark-submit, --master, "spark://master:7077", --driver-memory, 1536m, --executor-memory, 2g, --conf, spark.cores.max=4, --conf, spark.executor.cores=2, --conf, spark.driver.host=driver, --conf, spark.driver.bindAddress=0.0.0.0, --conf, spark.executor.processTreeMetrics.enabled=true, --conf, spark.executor.metrics.pollingInterval=250, --conf, spark.eventLog.logStageExecutorMetrics=true, /experiment/apps/benchmark.py, --source, /source, --mode, quick, --output, "/results/${RUN_ID:-quick}"]
    depends_on:
      master: {condition: service_healthy}
      worker-1: {condition: service_started}
      worker-2: {condition: service_started}
networks:
  lab: {internal: true}
volumes:
  results:
