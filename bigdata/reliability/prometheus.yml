global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: witw-reliability-live
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: collector
    static_configs:
      - targets: [collector-long:9103]
  - job_name: backend-pipeline
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend-before:9091, backend-after:9091]
  - job_name: kafka-offsets
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: spark-streaming
    static_configs:
      - targets: [spark:9102]
